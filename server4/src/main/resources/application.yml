spring:
  application:
    name: server4
  docker:
    compose:
      enabled: false   # start AxonServer manually: docker compose up -d

server:
  port: 8085

axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  axonserver:
    servers: localhost:8125

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    # Axon Framework core (messaging, query handling, lifecycle)
    org.axonframework: DEBUG
    org.axonframework.axonserver: INFO
